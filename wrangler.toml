name = "2fa-manager"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

# KV 命名空间用于存储用户数据
[[kv_namespaces]]
binding = "USERS_KV"
id = "your_kv_namespace_id"

# KV 命名空间用于速率限制
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "your_rate_limit_kv_id"

# 密钥配置（使用 wrangler secret put 命令设置）
# JWT_SECRET - JWT 签名密钥
# ENCRYPTION_KEY - 数据加密密钥
# OAUTH_CLIENT_ID - OAuth 客户端 ID
# OAUTH_CLIENT_SECRET - OAuth 客户端密钥
